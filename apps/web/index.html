<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-buttons="tonal" data-motion data-ground="sage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="description" content="Indian MF and ETF basket backtest for DIY investors. CAGR for lumpsum, XIRR for SIP." />
    <title>Basket Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("basket-lab-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#121212" : "#ffffff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      kind: software / fintech
      deal: palette signage (white plate, carbon ink, enamel yellow);
            type ibm plex sans + mono; radius sharp; buttons tonal; mark ring;
            first viewport is the league, not a marketing tour
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
