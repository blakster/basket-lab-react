[project]
name = "basket-lab-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "casparser==1.4.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
