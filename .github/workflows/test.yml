name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint:css
      - run: npx tsc -b

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/lint-filing-size.mjs

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  ensure-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x verify/ensure/run.sh && verify/ensure/run.sh
      - name: Replay pre-cf13d58 persist-order bug
        run: |
          set +e
          verify/ensure/run.sh bug
          code=$?
          set -e
          if [ "$code" != "12" ]; then
            echo "expected TLC invariant violation (exit 12), got $code"
            exit 1
          fi

  search-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x verify/search/run.sh && verify/search/run.sh
      - name: Replay pre-a47bf2d dismiss-then-resolve bug
        run: |
          set +e
          verify/search/run.sh bug
          code=$?
          set -e
          if [ "$code" != "12" ]; then
            echo "expected TLC invariant violation (exit 12), got $code"
            exit 1
          fi
